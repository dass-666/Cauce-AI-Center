<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cauce · Centro de operaciones</title>
  <link rel="stylesheet" href="app/estilos.css">
  <!-- three.js va copiado en vendor/ (sin CDN): funciona sin internet y sin servicios externos. -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">◈</span>
      <div>
        <h1>Centro de operaciones</h1>
        <p class="marca-sub">Actividad real de nuestros sistemas, solo lectura</p>
      </div>
    </div>
    <nav id="pisos" class="pisos" role="tablist" aria-label="Proyectos"></nav>
    <div class="controles">
      <button type="button" id="boton-sala" class="boton boton-sala" aria-pressed="false" aria-controls="sala-control"><span aria-hidden="true">◉</span><span class="texto-control"> Sala de control</span><span class="solo-lector"> (asuntos con datos reales:)</span> <span class="sala-contador" hidden></span></button>
      <div class="segmentado" role="group" aria-label="Tipo de vista">
        <button type="button" class="boton" data-vista="3d" aria-pressed="false">3D</button>
        <button type="button" class="boton" data-vista="2d" aria-pressed="false">Plano</button>
      </div>
      <button type="button" class="boton boton-inmersivo" data-inmersivo aria-pressed="false" title="Dar toda la pantalla al edificio (Esc para salir)"><span aria-hidden="true">⛶</span><span class="texto-control"> Inmersivo</span></button>
      <label class="interruptor"><input type="checkbox" id="bajo-consumo"> <span>Bajo consumo</span></label>
      <button type="button" id="recargar" class="boton" title="Volver a leer los datos ahora"><span aria-hidden="true" class="icono-control">↻</span><span class="texto-control"> Actualizar</span></button>
    </div>
  </header>

  <div id="banda-demo" class="banda-demo" role="note" hidden><span id="banda-demo-texto"></span></div>
  <div id="conexion" class="conexion" role="status" aria-live="polite"></div>
  <p id="aviso-vista" class="aviso-vista" role="status" hidden></p>
  <details id="diagnostico" class="diagnostico" hidden>
    <summary id="diagnostico-titulo"></summary>
    <ul id="diagnostico-lista"></ul>
  </details>

  <button type="button" id="salir-inmersivo" class="boton salir-inmersivo" data-inmersivo hidden>✕ Salir del modo inmersivo</button>

  <p id="llegada" class="llegada" role="status" hidden></p>

  <main class="principal">
    <section id="sala-control" class="sala-control" aria-labelledby="sala-titulo" hidden></section>
    <div id="oficina" class="oficina"></div>
    <aside id="panel" class="panel" hidden aria-label="Detalle"></aside>
  </main>

  <footer class="pie">
    Un personaje solo aparece trabajando si su sistema dejó un registro que lo respalde.
    <a href="pruebas.html">Pruebas</a>
  </footer>

  <script type="module" src="app/app.js"></script>
  <noscript>Este visualizador necesita JavaScript.</noscript>
</body>
</html>
