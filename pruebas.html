<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cauce · Pruebas</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; background: #0d1220; color: #e8ecf5; max-width: 860px; margin: 0 auto; padding: 16px; }
    .ok { color: #43c47a; } .falla { color: #ff5d5d; } li { margin: 4px 0; } pre { white-space: pre-wrap; color: #ffb547; margin: 2px 0 0; }
    #resumen { font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Pruebas del centro de operaciones</h1>
  <p id="resumen">Ejecutando…</p>
  <ol id="lista"></ol>
  <p><a href="index.html" style="color:#ffd89a">Volver al centro de operaciones</a></p>
  <script type="module">
    import { registrarCasos } from "./pruebas/casos.js";
    import { registrarCasosNaturaleza } from "./pruebas/casos-naturaleza.js";
    import { registrarCasosEkChuah } from "./pruebas/casos-ek-chuah.js";
    import { registrarCasosFaseI } from "./pruebas/casos-fase-i.js";
    import { registrarCasosFaseJ } from "./pruebas/casos-fase-j.js";
    import { registrarCasosFaseK } from "./pruebas/casos-fase-k.js";
    import { registrarCasosFaseL } from "./pruebas/casos-fase-l.js";
    import { registrarCasosRendimiento } from "./pruebas/casos-rendimiento.js";
    import { registrarCasosFaseM } from "./pruebas/casos-fase-m.js";
    import { registrarCasosNexus } from "./pruebas/casos-nexus.js";
    import { registrarCasosNexus15 } from "./pruebas/casos-nexus-15.js";
    import { registrarCasosCSI } from "./pruebas/casos-csi.js";
    import { registrarCasosCSIFase2 } from "./pruebas/casos-csi-fase2.js";
    import { registrarCasosCierre } from "./pruebas/casos-cierre.js";
    import { registrarCasosLaboratorio } from "./pruebas/casos-laboratorio.js";
    import { registrarCasosLaboratorioFase2 } from "./pruebas/casos-laboratorio-fase2.js";
    import { registrarCasosLaboratorioFase3 } from "./pruebas/casos-laboratorio-fase3.js";
    import { ejecutar } from "./pruebas/mini.js";
    const leer = async (ruta) => {
      const r = await fetch(ruta, { cache: "no-store" });
      if (!r.ok) throw new Error(`No se pudo leer ${ruta}`);
      return r.text();
    };
    registrarCasos(leer);
    registrarCasosNaturaleza(leer);
    registrarCasosEkChuah(leer);
    registrarCasosFaseI(leer);
    registrarCasosFaseJ(leer);
    registrarCasosFaseK(leer);
registrarCasosFaseL(leer);
    registrarCasosRendimiento(leer);
    registrarCasosFaseM(leer);
    registrarCasosNexus(leer);
    registrarCasosNexus15(leer);
    registrarCasosCSI(leer);
    registrarCasosCSIFase2();
    registrarCasosCierre(leer);
    registrarCasosLaboratorio(leer);
    registrarCasosLaboratorioFase2(leer);
    registrarCasosLaboratorioFase3(leer);
    const r = await ejecutar();
    const resumen = document.getElementById("resumen");
    resumen.textContent = `${r.pasaron} pasaron, ${r.fallaron} fallaron`;
    resumen.className = r.fallaron ? "falla" : "ok";
    document.title = `Cauce · Pruebas: ${resumen.textContent}`;
    for (const p of r.resultados) {
      const li = document.createElement("li");
      li.className = p.ok ? "ok" : "falla";
      li.textContent = `${p.ok ? "✓" : "✗"} ${p.nombre}`;
      if (!p.ok) { const pre = document.createElement("pre"); pre.textContent = p.error; li.append(pre); }
      document.getElementById("lista").append(li);
    }
  </script>
</body>
</html>
